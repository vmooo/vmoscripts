name: Python CI

on:
  push:
    branches: [ main, master ]
    paths:          
      - '**.py'
      - 'requirements*.txt'
      - 'setup.py'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.py'
      - 'requirements*.txt'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run flake8
        run: flake8 .